version: '3.8'

services:
  db:
    image: postgres:16
    container_name: crowdshield_db
    environment:
      POSTGRES_DB: crowdshield
      POSTGRES_USER: crowdshield_user
      POSTGRES_PASSWORD: crowdshield_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdshield_user -d crowdshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: crowdshield_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://crowdshield_user:crowdshield_password@db:5432/crowdshield
      - APP_ENV=development
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
